<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Lets-ol Sari-sari Store - Admin</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    font-family:Arial,Helvetica,sans-serif;
    background:#f2f2f2;
    color:#222;
}

body{
    overflow-x:hidden;
    padding-bottom:40px;
}

.header{
    width:100%;
    height:65px;
    background:#c9151e;
    color:white;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 20px;
    position:sticky;
    top:0;
    z-index:1000;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
}

.logo{
    font-size:20px;
    font-weight:bold;
    white-space:nowrap;
}

.header-title{
    font-size:23px;
    font-weight:bold;
}

.admin-name{
    font-size:13px;
    opacity:.9;
}

.container{
    width:100%;
    max-width:1700px;
    margin:auto;
    padding:18px;
}

.section{
    margin-bottom:28px;
}

.section-title{
    font-size:22px;
    font-weight:bold;
    margin:5px 0 13px;
}

.table-wrapper{
    width:100%;
    overflow-x:auto;
    background:white;
    border-radius:10px;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.orders-table{
    width:100%;
    min-width:1150px;
    border-collapse:collapse;
}

.orders-table th{
    background:#333;
    color:white;
    padding:11px 10px;
    text-align:left;
    font-size:12px;
    white-space:nowrap;
}

.orders-table td{
    padding:10px;
    border-bottom:1px solid #e5e5e5;
    vertical-align:middle;
    font-size:13px;
}

.orders-table tbody tr:last-child td{
    border-bottom:none;
}

.orders-table tbody tr:hover{
    background:#fafafa;
}

.order-number{
    font-size:17px;
    font-weight:bold;
    color:#c9151e;
    white-space:nowrap;
}

.customer-id{
    font-size:12px;
    color:#666;
    max-width:130px;
    word-break:break-all;
}

.products{
    min-width:300px;
    max-width:470px;
}

.product-line{
    display:flex;
    align-items:center;
    gap:8px;
    padding:4px 0;
    border-bottom:1px dashed #ddd;
}

.product-line:last-child{
    border-bottom:none;
}

.product-image{
    width:35px;
    height:35px;
    object-fit:cover;
    border-radius:5px;
    background:#eee;
    flex-shrink:0;
}

.product-name{
    font-weight:bold;
    line-height:1.2;
}

.product-detail{
    font-size:11px;
    color:#777;
    margin-top:2px;
}

.product-price{
    margin-left:auto;
    font-weight:bold;
    white-space:nowrap;
}

.item-count{
    text-align:center;
    font-weight:bold;
    white-space:nowrap;
}

.total{
    font-size:16px;
    font-weight:bold;
    color:#c9151e;
    white-space:nowrap;
}

.payment{
    font-weight:bold;
    white-space:nowrap;
}

.date{
    color:#666;
    font-size:11px;
    white-space:nowrap;
}

.status{
    display:inline-block;
    padding:6px 10px;
    border-radius:20px;
    font-size:11px;
    font-weight:bold;
    color:white;
    white-space:nowrap;
}

.status-pending{
    background:#ed9d00;
}

.status-accepted{
    background:#168f3d;
}

.status-completed{
    background:#1565c0;
}

.status-cancelled{
    background:#777;
}

.actions{
    white-space:nowrap;
}

button{
    border:none;
    border-radius:7px;
    padding:9px 13px;
    margin:2px;
    font-size:12px;
    font-weight:bold;
    cursor:pointer;
    touch-action:manipulation;
}

button:active{
    transform:scale(.97);
}

.btn-accept{
    background:#168f3d;
    color:white;
}

.btn-ready{
    background:#1565c0;
    color:white;
}

.btn-cancel{
    background:#d32f2f;
    color:white;
}

.btn-delete{
    background:#555;
    color:white;
}

.completed-toggle{
    width:100%;
    background:#1565c0;
    color:white;
    padding:14px 18px;
    font-size:15px;
    text-align:left;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:0;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.12);
}

.completed-toggle:hover{
    background:#0d56a5;
}

.completed-toggle-left{
    display:flex;
    align-items:center;
    gap:10px;
}

.completed-arrow{
    font-size:17px;
    transition:transform .2s ease;
}

.completed-toggle.open .completed-arrow{
    transform:rotate(90deg);
}

.completed-count{
    background:white;
    color:#1565c0;
    min-width:25px;
    height:25px;
    padding:0 7px;
    border-radius:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:12px;
}

.completed-content{
    display:none;
    margin-top:10px;
}

.completed-content.show{
    display:block;
}

.empty{
    background:white;
    padding:25px;
    text-align:center;
    color:#777;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.countdown{
    display:block;
    margin-top:4px;
    font-size:10px;
    color:#1565c0;
    font-weight:bold;
}

/* SALES */

.sales-section{
    margin-top:30px;
}

.sales-tabs{
    display:flex;
    gap:7px;
    margin-bottom:12px;
    flex-wrap:wrap;
}

.sales-tab{
    background:#ddd;
    color:#222;
    padding:10px 16px;
}

.sales-tab.active{
    background:#c9151e;
    color:white;
}

.sales-dashboard{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
}

.sales-card{
    background:white;
    border-radius:10px;
    padding:15px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.sales-label{
    font-size:11px;
    color:#777;
    text-transform:uppercase;
}

.sales-value{
    font-size:23px;
    font-weight:bold;
    margin-top:5px;
}

.sales-money{
    color:#168f3d;
}

.breakdown{
    background:white;
    margin-top:12px;
    border-radius:10px;
    padding:15px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.breakdown-title{
    font-size:17px;
    font-weight:bold;
    margin-bottom:8px;
}

.breakdown-table{
    width:100%;
    border-collapse:collapse;
}

.breakdown-table th{
    background:#eee;
    padding:9px;
    text-align:left;
    font-size:12px;
}

.breakdown-table td{
    padding:9px;
    border-bottom:1px solid #eee;
    font-size:13px;
}

.breakdown-table td:last-child,
.breakdown-table th:last-child{
    text-align:right;
}

.breakdown-table td:nth-child(2),
.breakdown-table th:nth-child(2){
    text-align:center;
}

@media(max-width:900px){

    .header{
        height:58px;
        padding:0 12px;
    }

    .logo{
        font-size:15px;
    }

    .header-title{
        font-size:17px;
    }

    .admin-name{
        font-size:10px;
    }

    .container{
        padding:10px;
    }

    .sales-dashboard{
        grid-template-columns:repeat(2,1fr);
    }
}
</style>

</head>

<body>

<div class="header">
    <div class="logo">🏪 Lets-ol</div>
    <div class="header-title">ADMIN ORDERS</div>
    <div class="admin-name">Administrator</div>
</div>

<div class="container">


<!-- CUSTOMER ORDERS -->

<div class="section">

    <div class="section-title">
        CUSTOMER ORDERS
    </div>

    <div id="ordersContainer">
        <div class="empty">
            Loading orders...
        </div>
    </div>

</div>


<!-- COMPLETED ORDERS -->

<div class="section">

    <button
        class="completed-toggle"
        id="completedToggle"
        onclick="toggleCompleted()">

        <span class="completed-toggle-left">

            <span
                class="completed-arrow"
                id="completedArrow">
                ▶
            </span>

            <span>
                COMPLETED ORDERS
            </span>

            <span
                class="completed-count"
                id="completedCount">
                0
            </span>

        </span>

        <span id="completedToggleText">
            SHOW
        </span>

    </button>


    <div
        class="completed-content"
        id="completedContent">

        <div id="completedContainer">
            <div class="empty">
                No completed orders.
            </div>
        </div>

    </div>

</div>


<!-- SALES -->

<div class="sales-section">

    <div class="section-title">
        SALES DASHBOARD
    </div>

    <div class="sales-tabs">

        <button
            class="sales-tab active"
            id="todayTab"
            onclick="showSales('today')">
            TODAY
        </button>

        <button
            class="sales-tab"
            id="weekTab"
            onclick="showSales('week')">
            THIS WEEK
        </button>

        <button
            class="sales-tab"
            id="monthTab"
            onclick="showSales('month')">
            THIS MONTH
        </button>

    </div>


    <div class="sales-dashboard">

        <div class="sales-card">
            <div class="sales-label">
                Orders
            </div>

            <div
                class="sales-value"
                id="salesOrders">
                0
            </div>
        </div>


        <div class="sales-card">
            <div class="sales-label">
                Items Sold
            </div>

            <div
                class="sales-value"
                id="salesItems">
                0
            </div>
        </div>


        <div class="sales-card">
            <div class="sales-label">
                Average Order
            </div>

            <div
                class="sales-value"
                id="salesAverage">
                ₱0.00
            </div>
        </div>


        <div class="sales-card">
            <div class="sales-label">
                Total Sales
            </div>

            <div
                class="sales-value sales-money"
                id="salesTotal">
                ₱0.00
            </div>
        </div>

    </div>


    <div class="breakdown">

        <div class="breakdown-title">
            ITEM BREAKDOWN
        </div>

        <div id="itemBreakdown">
            <div class="empty">
                No completed sales yet.
            </div>
        </div>

    </div>

</div>


</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getDatabase,
    ref,
    onValue,
    update,
    remove
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


const firebaseConfig = {

    apiKey:
        "AIzaSyBiKccKbLiKUUYYxFdiAfiyODhV-4cH7Qc",

    authDomain:
        "lets-ol.firebaseapp.com",

    databaseURL:
        "https://lets-ol-default-rtdb.firebaseio.com/",

    projectId:
        "lets-ol",

    storageBucket:
        "lets-ol.firebasestorage.app",

    messagingSenderId:
        "657291655058",

    appId:
        "1:657291655058:web:68bd82199760268f84f34b",

    measurementId:
        "G-7TVM23CQX6"
};


const app =
    initializeApp(firebaseConfig);

const db =
    getDatabase(app);

let allOrders = {};

let currentSalesPeriod =
    "today";

let readyTimers = {};

let completedOpen = false;


/* =========================
   CURRENCY
========================= */

function peso(value){

    return "₱" +
        Number(value || 0)
        .toLocaleString("en-PH",{
            minimumFractionDigits:2,
            maximumFractionDigits:2
        });
}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* =========================
   DATE
========================= */

function formatDate(timestamp){

    if(!timestamp){
        return "No date";
    }

    return new Date(timestamp)
        .toLocaleString("en-PH",{
            year:"numeric",
            month:"short",
            day:"numeric",
            hour:"numeric",
            minute:"2-digit",
            second:"2-digit"
        });
}


/* =========================
   GET ITEMS
========================= */

function getOrderItems(order){

    if(
        Array.isArray(order.items) &&
        order.items.length > 0
    ){

        return order.items.map(item => {

            const quantity =
                Number(item.quantity || 0);

            const price =
                Number(item.price || 0);

            let total =
                Number(item.total);

            if(!Number.isFinite(total)){
                total =
                    price * quantity;
            }

            return {
                product:
                    item.product ||
                    "Unknown Product",

                price:
                    price,

                quantity:
                    quantity,

                image:
                    item.image || "",

                total:
                    total
            };

        });
    }


    if(order.product){

        const quantity =
            Number(order.quantity || 1);

        const price =
            Number(order.price || 0);

        let total =
            Number(order.total);

        if(!Number.isFinite(total)){
            total =
                price * quantity;
        }

        return [{
            product:
                order.product,

            price:
                price,

            quantity:
                quantity,

            image:
                order.image || "",

            total:
                total
        }];
    }


    return [];
}


/* =========================
   ITEM COUNT
========================= */

function getItemCount(order){

    return getOrderItems(order)
        .reduce(
            (sum,item) =>
                sum +
                Number(item.quantity || 0),
            0
        );
}


/* =========================
   ORDER TOTAL
========================= */

function getOrderTotal(order){

    if(
        order.total !== undefined &&
        Number.isFinite(
            Number(order.total)
        )
    ){

        return Number(order.total);
    }


    return getOrderItems(order)
        .reduce(
            (sum,item) =>
                sum +
                Number(item.total || 0),
            0
        );
}


/* =========================
   STATUS CLASS
========================= */

function statusClass(status){

    if(status === "Accepted"){
        return "status-accepted";
    }

    if(status === "Completed"){
        return "status-completed";
    }

    if(status === "Cancelled"){
        return "status-cancelled";
    }

    return "status-pending";
}


/* =========================
   PRODUCTS
========================= */

function renderProducts(order){

    const items =
        getOrderItems(order);


    if(items.length === 0){

        return `
            <span style="color:#777;">
                No product information
            </span>
        `;
    }


    return items.map(item => {

        let imageHTML = "";

        if(item.image){

            imageHTML = `
                <img
                    class="product-image"
                    src="${escapeHTML(item.image)}"
                    onerror="this.style.display='none'">
            `;

        }else{

            imageHTML = `
                <div class="product-image"></div>
            `;
        }


        return `
            <div class="product-line">

                ${imageHTML}

                <div>

                    <div class="product-name">
                        ${escapeHTML(item.product)}
                    </div>

                    <div class="product-detail">
                        ${peso(item.price)}
                        ×
                        ${item.quantity}
                    </div>

                </div>

                <div class="product-price">
                    ${peso(item.total)}
                </div>

            </div>
        `;

    }).join("");
}


/* =========================
   ACTIONS
========================= */

function renderActions(key,order){

    const status =
        order.status || "Pending";


    if(status === "Pending"){

        return `
            <button
                class="btn-accept"
                onclick="acceptOrder('${key}')">
                ACCEPT
            </button>

            <button
                class="btn-cancel"
                onclick="cancelOrder('${key}')">
                CANCEL
            </button>
        `;
    }


    if(status === "Accepted"){

        let countdown = "";

        if(
            order.readyAt &&
            Number(order.readyAt) > Date.now()
        ){

            const seconds =
                Math.ceil(
                    (
                        Number(order.readyAt) -
                        Date.now()
                    ) / 1000
                );

            countdown = `
                <span
                    class="countdown"
                    id="countdown-${key}">
                    ${seconds}s
                </span>
            `;
        }


        return `
            <button
                class="btn-ready"
                onclick="readyOrder('${key}')"
                ${order.readyAt ? "disabled" : ""}>
                READY
            </button>

            <button
                class="btn-cancel"
                onclick="cancelOrder('${key}')">
                CANCEL
            </button>

            ${countdown}
        `;
    }


    if(status === "Completed"){

        return `
            <button
                class="btn-delete"
                onclick="deleteOrder('${key}')">
                DELETE
            </button>
        `;
    }


    if(status === "Cancelled"){

        return `
            <button
                class="btn-delete"
                onclick="deleteOrder('${key}')">
                DELETE
            </button>
        `;
    }


    return "";
}


/* =========================
   ORDER TABLE
========================= */

function renderOrderTable(list){

    if(list.length === 0){

        return `
            <div class="empty">
                No orders.
            </div>
        `;
    }


    return `
        <div class="table-wrapper">

            <table class="orders-table">

                <thead>

                    <tr>
                        <th>ORDER #</th>
                        <th>CUSTOMER</th>
                        <th>PRODUCTS</th>
                        <th>ITEMS</th>
                        <th>TOTAL</th>
                        <th>PAYMENT</th>
                        <th>DATE / TIME</th>
                        <th>STATUS</th>
                        <th>ACTION</th>
                    </tr>

                </thead>

                <tbody>

                    ${list.map(item => {

                        const key =
                            item.key;

                        const order =
                            item.order;

                        const status =
                            order.status ||
                            "Pending";

                        return `
                            <tr>

                                <td>
                                    <div class="order-number">
                                        #${escapeHTML(
                                            order.orderNumber ||
                                            key
                                        )}
                                    </div>
                                </td>

                                <td>
                                    <div class="customer-id">
                                        ${escapeHTML(
                                            order.customerId ||
                                            "Unknown"
                                        )}
                                    </div>
                                </td>

                                <td class="products">
                                    ${renderProducts(order)}
                                </td>

                                <td>
                                    <div class="item-count">
                                        ${getItemCount(order)}
                                    </div>
                                </td>

                                <td>
                                    <div class="total">
                                        ${peso(
                                            getOrderTotal(order)
                                        )}
                                    </div>
                                </td>

                                <td>
                                    <div class="payment">
                                        ${escapeHTML(
                                            order.payment ||
                                            "Unknown"
                                        )}
                                    </div>
                                </td>

                                <td>
                                    <div class="date">
                                        ${formatDate(
                                            order.createdAt
                                        )}
                                    </div>
                                </td>

                                <td>
                                    <span
                                        class="status ${statusClass(status)}">
                                        ${escapeHTML(status)}
                                    </span>
                                </td>

                                <td class="actions">
                                    ${renderActions(
                                        key,
                                        order
                                    )}
                                </td>

                            </tr>
                        `;

                    }).join("")}

                </tbody>

            </table>

        </div>
    `;
}


/* =========================
   RENDER ORDERS
========================= */

function renderOrders(){

    const active = [];

    const completed = [];


    Object.entries(allOrders)
        .forEach(([key,order]) => {

            if(!order){
                return;
            }


            if(order.status === "Completed"){

                completed.push({
                    key:key,
                    order:order
                });

            }else{

                active.push({
                    key:key,
                    order:order
                });

            }

        });


    active.sort(
        (a,b) =>
            Number(b.order.createdAt || 0) -
            Number(a.order.createdAt || 0)
    );


    completed.sort(
        (a,b) =>
            Number(
                b.order.completedAt ||
                b.order.createdAt ||
                0
            ) -
            Number(
                a.order.completedAt ||
                a.order.createdAt ||
                0
            )
    );


    document.getElementById(
        "ordersContainer"
    ).innerHTML =
        renderOrderTable(active);


    document.getElementById(
        "completedCount"
    ).textContent =
        completed.length;


    document.getElementById(
        "completedContainer"
    ).innerHTML =
        renderOrderTable(completed);


    startReadyCountdowns();
}


/* =========================
   COMPLETED TOGGLE
========================= */

window.toggleCompleted =
function(){

    const content =
        document.getElementById(
            "completedContent"
        );

    const button =
        document.getElementById(
            "completedToggle"
        );

    const text =
        document.getElementById(
            "completedToggleText"
        );


    completedOpen =
        !completedOpen;


    if(completedOpen){

        content.classList.add("show");

        button.classList.add("open");

        text.textContent =
            "HIDE";

    }else{

        content.classList.remove("show");

        button.classList.remove("open");

        text.textContent =
            "SHOW";
    }
};


/* =========================
   FIREBASE LISTENER
========================= */

const ordersRef =
    ref(db,"orders");


onValue(
    ordersRef,

    snapshot => {

        allOrders =
            snapshot.val() || {};

        renderOrders();

        updateSales();

    },

    error => {

        console.error(error);

        document.getElementById(
            "ordersContainer"
        ).innerHTML = `
            <div class="empty">
                Unable to load orders.
            </div>
        `;

    }
);


/* =========================
   ACCEPT
========================= */

window.acceptOrder =
async function(key){

    try{

        await update(
            ref(
                db,
                "orders/" + key
            ),
            {
                status:"Accepted",
                acceptedAt:Date.now()
            }
        );

    }catch(error){

        console.error(error);

        alert(
            "Unable to accept this order."
        );
    }
};


/* =========================
   CANCEL
========================= */

window.cancelOrder =
async function(key){

    if(
        !confirm(
            "Are you sure you want to cancel this order?"
        )
    ){

        return;
    }


    try{

        await update(
            ref(
                db,
                "orders/" + key
            ),
            {
                status:"Cancelled",
                cancelledAt:Date.now()
            }
        );

    }catch(error){

        console.error(error);

        alert(
            "Unable to cancel this order."
        );
    }
};


/* =========================
   READY
   10 SECONDS -> COMPLETED
========================= */

window.readyOrder =
async function(key){

    const order =
        allOrders[key];


    if(!order){
        return;
    }


    if(order.status !== "Accepted"){
        return;
    }


    if(order.readyAt){
        return;
    }


    const readyAt =
        Date.now() + 10000;


    try{

        await update(
            ref(
                db,
                "orders/" + key
            ),
            {
                readyAt:readyAt
            }
        );


        setTimeout(
            async () => {

                const current =
                    allOrders[key];


                if(!current){
                    return;
                }


                if(
                    current.status !==
                    "Accepted"
                ){
                    return;
                }


                if(!current.readyAt){
                    return;
                }


                try{

                    await update(
                        ref(
                            db,
                            "orders/" + key
                        ),
                        {
                            status:"Completed",
                            completedAt:
                                Date.now(),
                            readyAt:null
                        }
                    );

                }catch(error){

                    console.error(error);

                }

            },
            10000
        );

    }catch(error){

        console.error(error);

        alert(
            "Unable to mark order as ready."
        );
    }
};


/* =========================
   DELETE
========================= */

window.deleteOrder =
async function(key){

    if(
        !confirm(
            "Delete this order permanently?"
        )
    ){
        return;
    }


    try{

        await remove(
            ref(
                db,
                "orders/" + key
            )
        );

    }catch(error){

        console.error(error);

        alert(
            "Unable to delete order."
        );
    }
};


/* =========================
   COUNTDOWN
========================= */

function startReadyCountdowns(){

    Object.values(readyTimers)
        .forEach(timer => {
            clearInterval(timer);
        });


    readyTimers = {};


    Object.entries(allOrders)
        .forEach(([key,order]) => {

            if(
                !order ||
                order.status !== "Accepted" ||
                !order.readyAt ||
                Number(order.readyAt) <= Date.now()
            ){
                return;
            }


            readyTimers[key] =
                setInterval(
                    async () => {

                        const current =
                            allOrders[key];


                        if(!current){

                            clearInterval(
                                readyTimers[key]
                            );

                            return;
                        }


                        const remaining =
                            Math.ceil(
                                (
                                    Number(
                                        current.readyAt
                                    ) -
                                    Date.now()
                                ) / 1000
                            );


                        const element =
                            document.getElementById(
                                "countdown-" + key
                            );


                        if(remaining <= 0){

                            clearInterval(
                                readyTimers[key]
                            );


                            if(
                                current.status ===
                                "Accepted"
                            ){

                                try{

                                    await update(
                                        ref(
                                            db,
                                            "orders/" + key
                                        ),
                                        {
                                            status:"Completed",
                                            completedAt:
                                                Date.now(),
                                            readyAt:null
                                        }
                                    );

                                }catch(error){

                                    console.error(
                                        error
                                    );
                                }

                            }

                            return;
                        }


                        if(element){

                            element.textContent =
                                remaining + "s";
                        }

                    },
                    250
                );

        });
}


/* =========================
   SALES DATE HELPERS
========================= */

function startOfToday(){

    const date =
        new Date();

    date.setHours(
        0,0,0,0
    );

    return date.getTime();
}


function startOfWeek(){

    const date =
        new Date();

    date.setHours(
        0,0,0,0
    );


    const day =
        date.getDay();


    date.setDate(
        date.getDate() - day
    );


    return date.getTime();
}


function startOfMonth(){

    const date =
        new Date();

    date.setHours(
        0,0,0,0
    );


    date.setDate(1);

    return date.getTime();
}


/* =========================
   SALES START
========================= */

function getSalesStart(){

    if(
        currentSalesPeriod ===
        "week"
    ){

        return startOfWeek();
    }


    if(
        currentSalesPeriod ===
        "month"
    ){

        return startOfMonth();
    }


    return startOfToday();
}


/* =========================
   UPDATE SALES
========================= */

function updateSales(){

    const start =
        getSalesStart();


    let ordersCount = 0;

    let itemsSold = 0;

    let totalSales = 0;

    const products = {};


    Object.values(allOrders)
        .forEach(order => {

            if(!order){
                return;
            }


            if(
                order.status !==
                "Completed"
            ){
                return;
            }


            const date =
                Number(
                    order.completedAt ||
                    order.createdAt ||
                    0
                );


            if(date < start){
                return;
            }


            ordersCount++;


            const items =
                getOrderItems(order);


            items.forEach(item => {

                const quantity =
                    Number(
                        item.quantity || 0
                    );

                const total =
                    Number(
                        item.total || 0
                    );


                itemsSold +=
                    quantity;


                totalSales +=
                    total;


                if(
                    !products[item.product]
                ){

                    products[item.product] = {
                        quantity:0,
                        total:0
                    };
                }


                products[item.product]
                    .quantity +=
                    quantity;


                products[item.product]
                    .total +=
                    total;

            });

        });


    const average =
        ordersCount > 0
        ? totalSales / ordersCount
        : 0;


    document.getElementById(
        "salesOrders"
    ).textContent =
        ordersCount;


    document.getElementById(
        "salesItems"
    ).textContent =
        itemsSold;


    document.getElementById(
        "salesAverage"
    ).textContent =
        peso(average);


    document.getElementById(
        "salesTotal"
    ).textContent =
        peso(totalSales);


    renderBreakdown(products);
}


/* =========================
   BREAKDOWN
========================= */

function renderBreakdown(products){

    const container =
        document.getElementById(
            "itemBreakdown"
        );


    const list =
        Object.entries(products)
            .sort(
                (a,b) =>
                    b[1].quantity -
                    a[1].quantity
            );


    if(list.length === 0){

        container.innerHTML = `
            <div class="empty">
                No completed sales yet.
            </div>
        `;

        return;
    }


    container.innerHTML = `

        <table class="breakdown-table">

            <thead>

                <tr>
                    <th>PRODUCT</th>
                    <th>QTY</th>
                    <th>SALES</th>
                </tr>

            </thead>

            <tbody>

                ${list.map(
                    ([name,data]) => `

                    <tr>

                        <td>
                            ${escapeHTML(name)}
                        </td>

                        <td>
                            ${data.quantity}
                        </td>

                        <td>
                            ${peso(data.total)}
                        </td>

                    </tr>

                `).join("")}

            </tbody>

        </table>

    `;
}


/* =========================
   SALES TABS
========================= */

window.showSales =
function(period){

    currentSalesPeriod =
        period;


    document
        .querySelectorAll(
            ".sales-tab"
        )
        .forEach(button => {

            button.classList
                .remove("active");

        });


    if(period === "today"){

        document
            .getElementById("todayTab")
            .classList
            .add("active");
    }


    if(period === "week"){

        document
            .getElementById("weekTab")
            .classList
            .add("active");
    }


    if(period === "month"){

        document
            .getElementById("monthTab")
            .classList
            .add("active");
    }


    updateSales();
};


/* =========================
   AUTO REFRESH
========================= */

setInterval(
    () => {

        startReadyCountdowns();

        updateSales();

    },
    1000
);

</script>
